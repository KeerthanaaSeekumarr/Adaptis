{% extends "base.html" %}

{% block content %}
<!-- Minimal Header -->
<div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 4px;">
  <div>
    <h1 style="margin: 0; font-size: 1.35rem; font-weight: 700; color: var(--text-primary);">
      Entity Graph
    </h1>
  </div>
  <div style="font-size: 0.78rem; color: var(--text-muted);" class="mono">
    Passive Correlation Topology
  </div>
</div>

<div style="display: grid; grid-template-columns: 3fr 1fr; gap: 16px;">
  
  <!-- Graph Visualizer -->
  <div class="card" style="padding: 14px; margin-bottom: 0;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <div style="display: flex; gap: 12px; align-items: center; font-size: 0.78rem;" class="mono">
        <span><i class="fas fa-circle" style="color: var(--accent);"></i> IP Address</span>
        <span><i class="fas fa-globe" style="color: #a855f7;"></i> Domain / Host</span>
      </div>
      <button id="resetGraphBtn" style="background: var(--bg-card); border: 1px solid var(--border); color: var(--text-primary); padding: 4px 8px; border-radius: var(--radius); font-size: 0.72rem; cursor: pointer;" class="mono">
        Re-Center
      </button>
    </div>

    <div id="graphContainer" style="width: 100%; height: 500px; position: relative;">
      <svg id="entityGraphSvg"></svg>
    </div>
  </div>

  <!-- Inspector Panel -->
  <div class="card" style="margin-bottom: 0;">
    <h2 style="margin-top: 0; font-size: 0.95rem; font-weight: 600; border-bottom: 1px solid var(--border); padding-bottom: 10px; color: var(--text-primary);">
      Entity Inspector
    </h2>

    <div id="inspectorPanel">
      <div style="text-align: center; color: var(--text-muted); padding: 40px 10px;" class="mono">
        Click a node in the graph to inspect correlated signals.
      </div>
    </div>
  </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener("DOMContentLoaded", function() {
  let graphData = { nodes: [], links: [] };

  function loadEntityGraph() {
    fetch('/api/graph')
      .then(res => res.json())
      .then(data => {
        graphData = data;
        renderD3Graph(data);
      });
  }

  function renderD3Graph(data) {
    const container = document.getElementById('graphContainer');
    const width = container.clientWidth;
    const height = container.clientHeight;

    d3.select("#entityGraphSvg").selectAll("*").remove();

    const svg = d3.select("#entityGraphSvg")
      .attr("viewBox", [0, 0, width, height]);

    const g = svg.append("g");

    svg.call(d3.zoom()
      .scaleExtent([0.3, 4])
      .on("zoom", (event) => g.attr("transform", event.transform)));

    const simulation = d3.forceSimulation(data.nodes)
      .force("link", d3.forceLink(data.links).id(d => d.id).distance(100))
      .force("charge", d3.forceManyBody().strength(-240))
      .force("center", d3.forceCenter(width / 2, height / 2))
      .force("collision", d3.forceCollide().radius(30));

    const link = g.append("g")
      .selectAll("line")
      .data(data.links)
      .join("line")
      .attr("stroke", d => (d.severity === 'critical' ? '#ef4444' : '#38bdf8'))
      .attr("stroke-opacity", 0.6)
      .attr("stroke-width", 1.5);

    const node = g.append("g")
      .selectAll("g")
      .data(data.nodes)
      .join("g")
      .style("cursor", "pointer")
      .call(d3.drag()
        .on("start", dragstarted)
        .on("drag", dragged)
        .on("end", dragended))
      .on("click", (event, d) => inspectNode(d));

    node.append("circle")
      .attr("r", 9)
      .attr("fill", d => (d.type === 'host_or_domain' ? '#a855f7' : '#38bdf8'))
      .attr("stroke", "var(--bg-card)")
      .attr("stroke-width", 2);

    node.append("text")
      .text(d => d.label)
      .attr("x", 13)
      .attr("y", 4)
      .attr("fill", "var(--text-primary)")
      .attr("font-size", "10.5px")
      .attr("font-family", "JetBrains Mono");

    simulation.on("tick", () => {
      link
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);

      node.attr("transform", d => `translate(${d.x},${d.y})`);
    });

    function dragstarted(event, d) {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
    }

    function dragged(event, d) {
      d.fx = event.x;
      d.fy = event.y;
    }

    function dragended(event, d) {
      if (!event.active) simulation.alphaTarget(0);
      d.fx = null;
      d.fy = null;
    }

    document.getElementById('resetGraphBtn').onclick = function() {
      svg.transition().duration(500).call(
        d3.zoom().transform,
        d3.zoomIdentity
      );
      simulation.alpha(1).restart();
    };
  }

  function inspectNode(d) {
    const connectedEdges = graphData.links.filter(l => l.source.id === d.id || l.target.id === d.id || l.source === d.id || l.target === d.id);
    
    const panel = document.getElementById('inspectorPanel');
    panel.innerHTML = `
      <div style="background: var(--bg-body); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; margin-bottom: 12px;">
        <div style="font-size: 0.7rem; color: var(--text-muted);" class="mono">Entity Target</div>
        <div style="font-size: 1rem; font-weight: 700; color: var(--text-primary); margin: 2px 0;" class="mono">${d.label}</div>
        <div style="font-size: 0.72rem; color: var(--accent);" class="mono">Type: ${d.type}</div>
      </div>

      <h3 style="font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px;" class="mono">Correlated Flows (${connectedEdges.length})</h3>

      <div style="max-height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;">
        ${connectedEdges.map(e => `
          <div style="background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span class="mono" style="font-weight: 600; font-size: 0.8rem;">${e.flow_id}</span>
              <span class="mono" style="font-size: 0.72rem; color: var(--accent);">${e.confidence}%</span>
            </div>
            <div style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 2px;" class="mono">
              ${e.threat_class}
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }

  loadEntityGraph();
});
</script>
{% endblock %}
